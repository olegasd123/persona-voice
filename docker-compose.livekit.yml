# Self-hosted LiveKit SFU + token server. Lightweight, no GPU — runs on the Mac for
# dev and on the 4080 alongside the prod stack.
#
#   docker compose -f docker-compose.livekit.yml up --build
#
# Brings up:
#   livekit       the WebRTC SFU. Dev mode uses API key `devkey` / secret `secret`.
#   token-server  mints LiveKit join tokens for clients (Flutter app / Agents Playground).
#
# Then run the conversation agent on the host (it auto-joins rooms clients create):
#
#   LIVEKIT_URL=ws://localhost:7880 LIVEKIT_API_KEY=devkey LIVEKIT_API_SECRET=secret \
#     BACKEND=mac personavoice --serve
#
# To see the agent's per-turn metrics on the token-server's /metrics, also export
# PROMETHEUS_MULTIPROC_DIR (the shared dir the compose mount points at) for the worker, e.g.
#   PROMETHEUS_MULTIPROC_DIR=./models/metrics  ...  personavoice --serve
# Run the worker from the repo root so its relative path matches the mounted host dir.
#
# The Flutter client points at the token server (http://<host>:8080); it gets back the
# LiveKit URL + a token and connects there. IMPORTANT: `LIVEKIT_URL` is the address the
# *client* dials, so from a phone set it to the machine's LAN IP, e.g.
#   LIVEKIT_URL=ws://192.168.1.50:7880 docker compose -f docker-compose.livekit.yml up
#
# WebRTC media needs UDP. Dev mode muxes RTC over UDP 7882; on a LAN you may also need to
# open that port (and use the LAN IP above). For production, run LiveKit with TLS (wss://)
# and a real key/secret instead of dev mode.

# Separate project name from the main stack (so running both doesn't trigger orphan-container
# warnings) but kept on the `persona-voice` prefix so they sort together in Docker Desktop.
name: persona-voice-livekit

services:
  livekit:
    image: livekit/livekit-server:latest
    command: ["--dev", "--bind", "0.0.0.0"]
    ports:
      - "7880:7880"        # WebSocket signaling (ws://)
      - "7881:7881"        # TCP fallback for WebRTC
      - "7882:7882/udp"    # UDP media (RTC mux)
    restart: unless-stopped

  token-server:
    # Same image as the prod server (different command) — keeps one image, not two.
    image: personavoice/server:${TAG:-prod}
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - livekit
    environment:
      - BACKEND=${BACKEND:-mac}
      # The URL handed to clients — override with the LAN IP for phones (see header).
      - LIVEKIT_URL=${LIVEKIT_URL:-ws://localhost:7880}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-secret}
      - PERSONAVOICE_API_TOKEN=${PERSONAVOICE_API_TOKEN:-}
      # Memory is shared with the native agent worker (see the volume below). The at-rest
      # encryption key must MATCH the worker's, or the two disagree on encoding: a plaintext
      # consent write here is undecryptable by an encrypting worker (and vice versa), so the
      # consent silently never takes effect. Empty = plaintext on both sides (dev default).
      - PERSONAVOICE_MEMORY_KEY=${PERSONAVOICE_MEMORY_KEY:-}
      - PERSONAVOICE_PERSONA=${PERSONAVOICE_PERSONA:-companion}
      - PERSONAVOICE_HOST=0.0.0.0
      - PERSONAVOICE_PORT=8080
      # Admission control: /healthz reports `sessions_max` from this (static config),
      # so pass the SAME value the native worker uses. Default 1 = one session per worker.
      - PERSONAVOICE_MAX_SESSIONS=${PERSONAVOICE_MAX_SESSIONS:-1}
      # Optional 503 early gate: the gate runs HERE (in TokenService.issue), so
      # it must be set on this container, not just on the native worker. Off unless set; reads the
      # shared metrics dir below for the worker's live count. Retry-After comes from BUSY_RETRY_AFTER.
      - PERSONAVOICE_ADMISSION_503=${PERSONAVOICE_ADMISSION_503:-}
      - PERSONAVOICE_BUSY_RETRY_AFTER=${PERSONAVOICE_BUSY_RETRY_AFTER:-10}
      # Prometheus multi-process dir for /metrics. This is the ONE env var deliberately passed
      # INTO the container (unlike the data-dir vars below): prometheus_client picks multi-process
      # mode by the *presence* of this variable at import, so the token-server needs it set to its
      # container-side path to aggregate the native worker's per-turn metrics from the shared dir
      # below. The value is the fixed container target; the host side is the matching mount source.
      # The native agent worker must also export PROMETHEUS_MULTIPROC_DIR (to the HOST path, e.g.
      # ./models/metrics) so its turns land in the same dir — otherwise /metrics is just empty.
      - PROMETHEUS_MULTIPROC_DIR=/app/models/metrics
    volumes:
      # Dev loop: source is baked into the image (Dockerfile `COPY src` + editable `pip install
      # -e`), so a Python change would otherwise need a full image rebuild — and because `COPY
      # src` sits above the heavy pip layer, that rebuild re-runs the CUDA/chatterbox install.
      # Mounting the host `src` over the editable install's target (/app/src) makes edits live:
      # change a file, `docker compose -f docker-compose.livekit.yml restart token-server`, no
      # rebuild. Read-only — the app never writes its own source (and PYTHONDONTWRITEBYTECODE is
      # set, so no stray .pyc). Drop this line to pin the container to the baked image instead.
      - ./src:/app/src:ro
      # Config (backends + personas + voices.yaml) is data, not code: bind-mount it read-only so
      # the /voices catalog reflects the host's current config without rebuilding the image. A
      # baked-in copy goes stale the moment voices.yaml changes (e.g. the bundled Feminine/
      # Masculine chatterbox presets) and silently serves an empty picker. Restart the container
      # to reload after editing config.
      - ./config:/app/config:ro
      # Cloned / fine-tuned voices are written host-side (the agent worker, the seed script
      # `personavoice-seed-voices`). Mount them so the token-server's /voices catalog lists
      # them — otherwise the container sees an empty store and the picker shows no clones.
      #
      # The HOST source of each mount below is driven by the SAME env var the native worker
      # reads (interpolated from the project `.env`), so relocating a dir moves both the worker
      # and this mount in lockstep — they can't silently drift apart. The CONTAINER target stays
      # fixed at /app/models/* (an internal path; the var is never passed into the container, so
      # the app there always resolves to the default that matches the target).
      #
      # These use the long-form `type: bind` on purpose: with the short `src:dst` syntax compose
      # reads a source that lacks a `./`, `/` or `~` prefix (e.g. our `.env.example` default
      # `models/memory`) as a *named volume* and aborts with "refers to undefined volume". The
      # explicit bind type accepts any path shape — bare-relative, `./`-relative, or absolute.
      # A relative source is resolved against the project dir by compose and against its cwd by
      # the worker — these coincide only when the worker runs from the repo root (the documented
      # convention); an absolute path (e.g. /srv/pv-memory) sidesteps that assumption.
      # `create_host_path` keeps the short-syntax convenience of auto-creating a missing dir.
      - type: bind
        source: ${PERSONAVOICE_CLONES_DIR:-./models/clones}
        target: /app/models/clones
        bind:
          create_host_path: true
      - type: bind
        source: ${PERSONAVOICE_FINETUNED_DIR:-./models/finetuned}
        target: /app/models/finetuned
        bind:
          create_host_path: true
      # Per-user conversation memory (consent + transcripts + profile). The native agent worker
      # writes it host-side and gates ALL recording on consent; the token-server reads it (and,
      # once the /consent route lands, writes it when a client opts in/out). Read-write, and the
      # one place a drift here disables consent *silently* (a missing consent file reads as "not
      # opted in", not an error) — which is exactly why the host source is env-driven.
      - type: bind
        source: ${PERSONAVOICE_MEMORY_DIR:-./models/memory}
        target: /app/models/memory
        bind:
          create_host_path: true
      # Prometheus multi-process metrics dir, shared with the native agent worker. The worker
      # writes one mmap file per process here (gated by its PROMETHEUS_MULTIPROC_DIR); the
      # token-server's /metrics reads + aggregates them (see PROMETHEUS_MULTIPROC_DIR above). The
      # host source is driven by the SAME var the worker reads, keeping the two in lockstep just
      # like the data dirs; the container target is the fixed path the env var above points at.
      - type: bind
        source: ${PROMETHEUS_MULTIPROC_DIR:-./models/metrics}
        target: /app/models/metrics
        bind:
          create_host_path: true
    ports:
      - "8080:8080"
    command:
      - python3.12
      - -m
      - personavoice.server
      - --token-server
      - --no-color
    restart: unless-stopped
