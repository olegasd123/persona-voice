# RTX 4080 (16 GB) production stack for Persona-Voice.
#
#   docker compose up --build      # start vLLM (LLM) + the persona-voice server
#
# Both services share the single GPU. Target VRAM budget (within 16 GB):
#
#   vLLM   Qwen2.5-7B-Instruct-AWQ (4-bit) + KV cache  : ~6-7 GB  (gpu_mem_util 0.45)
#   STT    faster-whisper large-v3 (float16)           : ~2 GB
#   TTS    Chatterbox (torch)                          : ~2-3 GB
#                                                  total ≈ 10-12 GB, with headroom.
#
# Orpheus TTS runs its OWN in-process vLLM (+~6 GB) and is too tight alongside the LLM vLLM
# on a single 4080 — prefer Chatterbox here (set `adapter: chatterbox` in
# config/backends/cuda.yaml), or give Orpheus a second GPU.

services:
  vllm:
    image: vllm/vllm-openai:latest
    command:
      - --model=Qwen/Qwen2.5-7B-Instruct-AWQ
      - --quantization=awq
      - --max-model-len=8192
      - --gpu-memory-utilization=0.45   # leave room for STT + TTS on the same card
      - --port=8000
    ports:
      - "8000:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s   # first run downloads the model
    restart: unless-stopped

  personavoice:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      vllm:
        condition: service_healthy
    environment:
      - BACKEND=cuda
      - VLLM_BASE_URL=http://vllm:8000/v1
      - PERSONAVOICE_API_TOKEN=${PERSONAVOICE_API_TOKEN:-}
      - HF_TOKEN=${HF_TOKEN:-}
    ports:
      - "8080:8080"
    volumes:
      - hf-cache:/models/hf      # share the HF cache so STT/TTS weights download once
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # M2: validate the cuda config against the running vLLM. M3 replaces this with the live
    # streaming server (`personavoice serve`).
    command:
      - python3.12
      - -m
      - personavoice.server
      - --check
      - --no-color
    restart: "no"

volumes:
  hf-cache:
