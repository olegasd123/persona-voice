[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "persona-voice"
version = "0.0.1"
description = "Real-time, open-source speech-to-speech persona system (STT -> LLM -> TTS) with swappable Mac/CUDA backends."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Oleg" }]
keywords = ["speech-to-speech", "tts", "stt", "llm", "persona", "voice-cloning", "livekit"]

# Core deps are intentionally light so the repo installs and `--check` runs on any
# machine without pulling heavy ML wheels. Backend-specific model libs live in the
# optional `mac` / `cuda` extras below.
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# --- Mac (M4 Max) backend --------------------------------------------------------------
mac = [
    "huggingface-hub>=0.23",
    "mlx-whisper>=0.4",
    "mlx-lm>=0.14",
    "kokoro>=0.7",          # fast Mac TTS for quick iteration (no cloning)
    "soundfile>=0.12",
    "numpy>=1.26",
    "httpx>=0.27",          # talks to the local Ollama server
    "sounddevice>=0.4",     # optional mic capture for `personavoice-demo --record`
]
# --- CUDA (RTX 4080) backend ------------------------------------------------------------
cuda = [
    "huggingface-hub>=0.23",
    "faster-whisper>=1.0",
    "soundfile>=0.12",
    "numpy>=1.26",
    "httpx>=0.27",          # OpenAI-compatible HTTP for the vLLM server
    # vLLM (LLM), CUDA TTS (chatterbox-tts), and Parakeet STT
    # (nemo_toolkit[asr]) are installed in the server image, not here: they need a CUDA
    # toolchain / are heavy. faster-whisper (above) is the default CUDA STT. See Dockerfile.
]
# --- Real-time orchestration --------------------------------------------
livekit = [
    "livekit-agents>=0.11",
    "livekit-plugins-silero>=0.7",
]
# --- Zero-shot voice cloning --------------------------------------------
# Chatterbox is the clean-license (MIT) cloning backend; runs on CUDA (4080) and MPS (Mac).
clone = [
    "chatterbox-tts>=0.1",
]
# --- Persona LoRA fine-tuning -------------------------------------------
# Mac LoRA training via mlx-lm (also in the `mac` extra). The CUDA QLoRA trainer
# (LLaMA-Factory / Unsloth) is heavy + needs a CUDA toolchain, so it's installed in the
# training image, not here — see training/persona_lora/README.md.
train = [
    "mlx-lm>=0.14",
]
# --- Voice fine-tuning A/B eval -----------------------------------------
# Speaker-similarity scoring for the fine-tuned-vs-clone A/B. The voice trainers themselves
# are heavy + need a CUDA toolchain, so they live in the training image, not here — see
# training/voice/README.md.
voice-eval = [
    "resemblyzer>=0.1",     # speaker embeddings for the voice-quality A/B (PERSONAVOICE eval)
]
# --- Conversation memory ------------------------------------------------
# Core memory (store, profile, keyword recall, distill) needs nothing beyond the base deps.
# `memory` adds at-rest encryption; `memory-embeddings` adds semantic recall — both lazy,
# so the default keyword-recall + plaintext path runs on the core install.
memory = [
    "cryptography>=42.0",   # Fernet encryption of stored conversations (PERSONAVOICE_MEMORY_KEY)
]
memory-embeddings = [
    "sentence-transformers>=2.7",  # optional semantic retrieval (EmbeddingRetriever)
]
# --- Prometheus metrics -------------------------------------------------------
# Optional: turns the per-turn latency/outcome record into scrapeable counters/histograms and
# backs the token server's /metrics route. No-op (empty /metrics) when this isn't installed.
metrics = [
    "prometheus-client>=0.20",
]
# --- Tooling --------------------------------------------------------------------------
dev = [
    # Pinned to a single minor so CI's `ruff format --check` and the local pre-commit hook
    # agree (the formatter's output drifts across minors). Bump here and in .pre-commit-config
    # together.
    "ruff>=0.15,<0.16",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pre-commit>=3.7",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    # The audio helpers + STT warmup use numpy/soundfile (otherwise backend-extra deps), so the
    # test suite needs them on a bare install. They're light wheels — kept out of the core deps
    # but part of the dev/test environment so `pytest` passes without a mac/cuda extra.
    "numpy>=1.26",
    "soundfile>=0.12",
    # So the metrics tests exercise the real exporter (the no-op path is covered by monkeypatch).
    "prometheus-client>=0.20",
]

[project.scripts]
personavoice = "personavoice.server.__main__:main"
personavoice-demo = "personavoice.orchestrator.demo:main"
personavoice-stream-demo = "personavoice.orchestrator.stream_demo:main"
personavoice-agent = "personavoice.orchestrator.agent:run"
personavoice-token-server = "personavoice.server.token_server:main"
personavoice-persona = "personavoice.persona.cli:main"
personavoice-clone = "personavoice.voice.cli:main"
personavoice-seed-voices = "personavoice.voice.seed:main"
personavoice-train = "personavoice.training.cli:main"
personavoice-voice-train = "personavoice.training.voice.cli:main"
personavoice-memory = "personavoice.memory.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/personavoice"]

# --------------------------------------------------------------------------------------
# Tooling configuration
# --------------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF", "SIM"]
ignore = ["E501"]  # line length handled by the formatter

[tool.ruff.lint.per-file-ignores]
# Tests use asserts (S101) and may do blocking file I/O inside async test fns (ASYNC230/240).
"tests/*" = ["S101", "ASYNC230", "ASYNC240"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
# 3.12 (not 3.11) so mypy can parse numpy's bundled stubs, which use PEP 695
# `type` statements that are only valid syntax at the 3.12+ target. Runtime
# still supports 3.11 (see requires-python); the 3.11 CI job exercises that.
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
namespace_packages = true
mypy_path = "src"
