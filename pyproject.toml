[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "persona-voice"
version = "0.0.1"
description = "Real-time, open-source speech-to-speech persona system (STT -> LLM -> TTS) with swappable Mac/CUDA backends."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Oleg" }]
keywords = ["speech-to-speech", "tts", "stt", "llm", "persona", "voice-cloning", "livekit"]

# Core deps are intentionally light so the repo installs and `--check` runs on any
# machine without pulling heavy ML wheels. Backend-specific model libs live in the
# optional `mac` / `cuda` extras below.
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# --- Mac (M4 Max) development backend -------------------------------------------------
mac = [
    "huggingface-hub>=0.23",
    "mlx-whisper>=0.4",
    "mlx-lm>=0.14",
    "kokoro>=0.7",          # fast Mac TTS for dev iterations (no cloning)
    "soundfile>=0.12",
    "numpy>=1.26",
    "httpx>=0.27",          # talks to the local Ollama server
    "sounddevice>=0.4",     # optional mic capture for `personavoice-demo --record`
]
# --- CUDA (RTX 4080) production backend -----------------------------------------------
cuda = [
    "huggingface-hub>=0.23",
    "faster-whisper>=1.0",
    "soundfile>=0.12",
    "numpy>=1.26",
    "httpx>=0.27",          # OpenAI-compatible HTTP for the vLLM server (M2)
    # vLLM (LLM), CUDA TTS (chatterbox-tts / orpheus-speech), and Parakeet STT
    # (nemo_toolkit[asr]) are installed in the server image, not here: they need a CUDA
    # toolchain / are heavy. faster-whisper (above) is the default CUDA STT. See Dockerfile.
]
# --- Real-time orchestration (added in M3) --------------------------------------------
livekit = [
    "livekit-agents>=0.11",
    "livekit-plugins-silero>=0.7",
]
# --- Zero-shot voice cloning (added in M5) --------------------------------------------
# Chatterbox is the clean-license (MIT) cloning backend; runs on CUDA (4080) and MPS (Mac).
clone = [
    "chatterbox-tts>=0.1",
]
# F5-TTS-mlx is the Apple-Silicon cloning backend. Its default checkpoint's *weights* are
# CC-BY-NC (non-commercial) — fine for Mac dev, but ship with Chatterbox. See the README.
clone-mac = [
    "f5-tts-mlx>=0.2",
]
# --- Tooling --------------------------------------------------------------------------
dev = [
    "ruff>=0.5",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pre-commit>=3.7",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
personavoice = "personavoice.server.__main__:main"
personavoice-demo = "personavoice.orchestrator.demo:main"
personavoice-stream-demo = "personavoice.orchestrator.stream_demo:main"
personavoice-agent = "personavoice.orchestrator.agent:run"
personavoice-clone = "personavoice.voice.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/personavoice"]

# --------------------------------------------------------------------------------------
# Tooling configuration
# --------------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF", "SIM"]
ignore = ["E501"]  # line length handled by the formatter

[tool.ruff.lint.per-file-ignores]
# Tests use asserts (S101) and may do blocking file I/O inside async test fns (ASYNC230/240).
"tests/*" = ["S101", "ASYNC230", "ASYNC240"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
namespace_packages = true
mypy_path = "src"
