name: personavoice_client
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  livekit_client: ^2.8.0
  permission_handler: ^12.0.3
  shared_preferences: ^2.5.5
  file_picker: ^8.1.0
  record: ^5.1.0
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# `record` 5.2.1 caps record_linux at <1.0.0 (forcing the stale 0.7.2) while still
# pulling record_platform_interface 1.6.0, whose startStream / hasPermission additions
# 0.7.2 never implemented. That broken combo fails the iOS kernel_snapshot build even
# though the Linux backend is unused. 1.3.1 implements both members and accepts 1.6.0.
dependency_overrides:
  record_linux: ^1.3.1

flutter:
  uses-material-design: true
