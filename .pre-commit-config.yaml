repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in lockstep with the `ruff` pin in pyproject.toml's `dev` extra so local
    # formatting matches what CI's `ruff format --check` enforces.
    rev: v0.15.18
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-merge-conflict
