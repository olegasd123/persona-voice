# Voice registry — the logical voices personas reference (config/personas/*.yaml: voice.ref).
#
# Each maps to a backend-native preset so the four personas sound DISTINCT on whichever
# backend is active: Kokoro presets (af_*/am_* — female/male) on the Mac, Orpheus presets
# (tara/leah/jess/leo/...) on the 4080. Clone-only backends (Chatterbox/F5) have no preset
# and fall back to their default voice until a clone is assigned, which then uses the
# `sample` field (a ~10 s wav) added here per voice.
#
# Personas reference these as `voices/<id>`; the `voices/` prefix is stripped on lookup.

companion_soft:
  description: warm, soft, feminine
  emotion: warm
  presets:
    kokoro: af_heart
    orpheus: tara

hr_warm:
  description: warm, professional, feminine
  emotion: neutral-warm
  presets:
    kokoro: af_sarah
    orpheus: leah

teacher_clear:
  description: clear, friendly, feminine
  emotion: friendly
  presets:
    kokoro: af_nicole
    orpheus: jess

pm_calm:
  description: calm, measured, masculine
  emotion: neutral
  presets:
    kokoro: am_michael
    orpheus: leo
