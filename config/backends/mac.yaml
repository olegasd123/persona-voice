# M4 Max backend. Adapters: whisper_mlx (STT), lmstudio (LLM), kokoro (TTS).
# Kokoro is fast and preset-only. Use the CUDA backend with Chatterbox for voice cloning.
backend: mac

stt:
  adapter: whisper_mlx
  model: mlx-community/whisper-large-v3-turbo
  options:
    language: en

llm:
  # LM Studio's OpenAI-compatible server. `model` must match a model available in LM Studio
  # (see `curl $LMSTUDIO_BASE_URL/models`). gpt-oss-20b at reasoning_effort=low is snappy for
  # the dev voice loop; Qwen3 reasoning models work too but spend tokens/latency on thinking.
  # Alternative: adapter: ollama, model: qwen2.5:7b-instruct, base_url: http://localhost:11434
  adapter: lmstudio
  model: openai/gpt-oss-20b
  options:
    base_url: ${LMSTUDIO_BASE_URL:-http://localhost:1234/v1}
    extra_body:
      # Reasoning models only: keep the thinking trace short so spoken replies start fast.
      reasoning_effort: low

tts:
  adapter: kokoro
  model: hexgrad/Kokoro-82M
  options:
    voice: af_heart
    lang_code: a
    sample_rate: 24000
    speed: 1.0
