# CUDA backend (RTX 4080 16 GB ↔ RTX 5090 32 GB).
#
# Defaults target the dockerized prod stack: faster-whisper (STT) + vLLM (LLM) + Orpheus (TTS).
# The adapter / model / base-url for each stage are env-overridable via single-level
# `${VAR:-default}` interpolation (same pattern this file already used for the base URL), so the
# *same* file also drives a Windows-native dev box that serves the brain from LM Studio and
# synthesizes with Chatterbox — set the PERSONAVOICE_* vars in `.env` (see `.env.example`).
#
# Footprint on 16 GB: STT ~2 GB + LLM ~6-7 GB (4-bit) + TTS ~2-3 GB ≈ 10-12 GB. A 32 GB card
# (5090) has ample headroom for an unquantized 7B + a larger TTS.
backend: cuda

stt:
  # Alternative: adapter: parakeet, model: nvidia/parakeet-tdt-0.6b-v2 (NeMo).
  adapter: ${PERSONAVOICE_STT_ADAPTER:-faster_whisper}
  model: ${PERSONAVOICE_STT_MODEL:-large-v3-turbo}
  options:
    device: ${PERSONAVOICE_STT_DEVICE:-cuda}
    compute_type: ${PERSONAVOICE_STT_COMPUTE:-float16}
    language: en

llm:
  # vLLM (default) serves an OpenAI-compatible API; `model` must match the id vLLM serves
  # (= VLLM_MODEL in docker-compose.yml). The 4080-safe default is the AWQ 4-bit build; a bigger
  # card serves the unquantized Qwen/Qwen2.5-7B-Instruct (set both VLLM_MODEL and this to it).
  # vLLM auto-detects AWQ from the model config, so there is no `--quantization` server flag.
  # Windows-native dev: set PERSONAVOICE_LLM_ADAPTER=lmstudio + a matching model + base_url
  # (http://localhost:1234/v1) to serve the brain from LM Studio instead.
  adapter: ${PERSONAVOICE_LLM_ADAPTER:-vllm}
  model: ${PERSONAVOICE_LLM_MODEL:-Qwen/Qwen2.5-7B-Instruct-AWQ}
  options:
    # Defaults to the vLLM server; LM Studio dev sets this to http://localhost:1234/v1.
    base_url: ${PERSONAVOICE_LLM_BASE_URL:-http://localhost:8000/v1}

tts:
  # Orpheus (default) = expressive, emotion tags (preset voices only), but runs its own
  # in-process vLLM (awkward on Windows native) and inherits the Llama-3.2 license. Chatterbox
  # (MIT, torch) is the Windows-native + zero-shot-cloning backend (M5): set
  # PERSONAVOICE_TTS_ADAPTER=chatterbox. `device`/`sample_rate` apply to whichever is selected.
  adapter: ${PERSONAVOICE_TTS_ADAPTER:-orpheus}
  model: ${PERSONAVOICE_TTS_MODEL:-canopylabs/orpheus-3b-0.1-ft}
  options:
    device: ${PERSONAVOICE_TTS_DEVICE:-cuda}
    sample_rate: 24000
